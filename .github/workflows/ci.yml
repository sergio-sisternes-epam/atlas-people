name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-smoke:
    name: Compile and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jsonschema: Atlas CLI needs it for SCHEMA 2.0 smokes (pin matches Atlas scripts/requirements-ci.txt).
      - name: Install APM, PyYAML, and jsonschema
        run: python3 -m pip install apm-cli pyyaml "jsonschema==4.25.1"
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Consumer install and compile
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          apm install "$GITHUB_WORKSPACE" --target agent-skills,cursor
          apm compile --validate --target agent-skills,cursor
          test -f .agents/skills/atlas-people/SKILL.md
      # Atlas CLI checkouts live under the workspace (actions/checkout needs
      # that); .gitignore lists .ci-atlas*/ so rg-based scenario checks and the
      # hygiene scan skip them.
      - name: Checkout Atlas CLI v0.13.1
        uses: actions/checkout@v5
        with:
          repository: sergio-sisternes-epam/atlas
          ref: v0.13.1
          path: .ci-atlas-v0.13.1
          persist-credentials: false
          sparse-checkout: |
            scripts
      - name: Checkout Atlas CLI v0.13.0
        uses: actions/checkout@v5
        with:
          repository: sergio-sisternes-epam/atlas
          ref: v0.13.0
          path: .ci-atlas-v0.13.0
          persist-credentials: false
          sparse-checkout: |
            scripts
      - name: Atlas overlay smoke
        env:
          ATLAS_CLIS: >-
            ${{ github.workspace }}/.ci-atlas-v0.13.1/scripts/atlas.py
            ${{ github.workspace }}/.ci-atlas-v0.13.0/scripts/atlas.py
        run: bash scripts/overlay-smoke.sh
      - name: Run scenario smokes
        env:
          ATLAS_CLI: ${{ github.workspace }}/.ci-atlas-v0.13.1/scripts/atlas.py
          # Optional repository variable; the smoke records a deferral when unset.
          PEOPLE_FORBIDDEN_SLUGS: ${{ vars.PEOPLE_FORBIDDEN_SLUGS }}
        run: bash scripts/run-scenarios.sh
      - name: Pack dry run
        run: apm pack --dry-run
