id: people-public-ack-v1
packages:
  - atlas-people
work_id: 2026-10-09-people-public-ack
adversarial: true
# Run every check from the package root (bash scripts/run-scenarios.sh).
# Prose checks flatten each file (newlines and runs of spaces → one space)
# so wrapped sentences still match. Every line must match; a negative
# `! rg` appears only as the last line of a check.
smokes:
  - id: public-target-requires-ack
    source: owner-design-public-ack
    expect: a public target needs the separate acknowledgement with the exact prompt text, recorded as atlas_target_visibility public-acknowledged before the overlay mount and the first write
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      for f in SKILL.md references/paths/remember.md references/paths/import-notes.md; do
        rg -n -F "Person pages will be publicly readable and can't be fully removed (history and forks keep them). Continue?" "$f" >/dev/null || { echo "missing exact prompt: $f"; exit 1; }
        rg -n -F 'atlas_target_visibility: public-acknowledged' "$f" >/dev/null || { echo "missing public-acknowledged: $f"; exit 1; }
        flat "$f" | grep -F 'before the overlay mount' >/dev/null || { echo "missing before-mount ordering: $f"; exit 1; }
      done
      rg -n -F 'atlas_target_visibility: private | public | unknown | public-acknowledged' SKILL.md
      flat SKILL.md | grep -F 'writes on a public or unknown-visibility target require `atlas_target_visibility: public-acknowledged`' >/dev/null
      flat README.md | grep -F "Person pages will be publicly readable and can't be fully removed (history and forks keep them). Continue?" >/dev/null
  - id: unknown-visibility-requires-ack
    source: owner-design-public-ack
    expect: unknown visibility (host not queryable, failed or ambiguous lookup) is treated like public and never assumed private; visibility is never guessed from the repository name
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      flat SKILL.md | grep -F 'Treat `unknown` like `public`; never assume private.' >/dev/null
      flat SKILL.md | grep -F 'the host cannot be queried, the query fails, or the answer is ambiguous' >/dev/null
      flat SKILL.md | grep -F 'Omitted `atlas_target_visibility` → **`unknown`** (never `private`)' >/dev/null
      flat SKILL.md | grep -F 'Do not guess from the repository name.' >/dev/null
      flat SKILL.md | grep -F 'When `atlas_target_visibility` is `public` or `unknown`, ask the operator a separate explicit acknowledgement' >/dev/null
      for f in references/paths/remember.md references/paths/import-notes.md; do
        flat "$f" | grep -F 'Unknown visibility is treated like public, never assumed private.' >/dev/null || { echo "missing unknown-as-public: $f"; exit 1; }
        flat "$f" | grep -F 'When it is `public` or `unknown`, ask the operator a separate explicit acknowledgement' >/dev/null || { echo "missing unknown trigger: $f"; exit 1; }
      done
      flat README.md | grep -F '`unknown`, never assumed private' >/dev/null
  - id: private-known-no-extra-step
    source: owner-design-public-ack
    expect: a private target with known visibility (including a local-only Atlas with no remote) needs no extra step
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      for f in SKILL.md references/paths/remember.md references/paths/import-notes.md; do
        flat "$f" | grep -F 'A private target with known visibility (`atlas_target_visibility: private`) needs no extra step.' >/dev/null || { echo "missing private no-extra-step: $f"; exit 1; }
      done
      flat SKILL.md | grep -F 'a local-only Atlas with no remote is private' >/dev/null
      flat README.md | grep -F 'Private targets with known visibility need no extra step' >/dev/null
  - id: decline-means-no-write
    source: owner-design-public-ack
    expect: declining the acknowledgement stops with no write and the public-ack stop string, while the target itself is not refused
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      for f in SKILL.md references/paths/remember.md references/paths/import-notes.md; do
        flat "$f" | grep -F '**stop** with no write (`incomplete: public target not acknowledged`)' >/dev/null || { echo "missing no-write stop: $f"; exit 1; }
        flat "$f" | grep -i -F 'the target itself is not refused' >/dev/null || { echo "missing target-not-refused: $f"; exit 1; }
      done
      flat SKILL.md | grep -F 'The target itself is not refused: it stays confirmed, and the operator may choose another target or acknowledge later.' >/dev/null
      flat SKILL.md | grep -F 'This gate never refuses a target on policy grounds.' >/dev/null
      flat README.md | grep -F 'Declining stops with no write (`incomplete: public target not acknowledged`); the target itself is not refused.' >/dev/null
  - id: confirmation-alone-not-enough
    source: owner-design-public-ack
    expect: atlas_target confirmed never counts as the public-visibility acknowledgement; it is a separate question asked after the target confirmation and repeated when the target changes
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      for f in SKILL.md README.md references/paths/remember.md references/paths/import-notes.md; do
        flat "$f" | grep -F '`atlas_target: confirmed` never counts as this acknowledgement' >/dev/null || { echo "missing confirmation-not-consent: $f"; exit 1; }
      done
      flat SKILL.md | grep -F 'A plain target confirmation (`atlas_target: confirmed`) never counts as this acknowledgement: it is a separate question and answer, asked after the target confirmation.' >/dev/null
      flat SKILL.md | grep -F 'If the target changes, determine visibility and ask for the acknowledgement again.' >/dev/null
  - id: public-ack-mirror-and-paths
    source: owner-design-public-ack
    expect: the .apm mirror carries the gate byte-identically; the remember and import-notes modules gate the overlay mount on it; the fail-closed list and exit checklist carry it; query needs no acknowledgement
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      cmp SKILL.md .apm/skills/atlas-people/SKILL.md
      rg -n -F "Person pages will be publicly readable and can't be fully removed (history and forks keep them). Continue?" .apm/skills/atlas-people/SKILL.md
      rg -n -F 'atlas_target_visibility: private | public | unknown | public-acknowledged' .apm/skills/atlas-people/SKILL.md
      flat references/paths/remember.md | grep -F 'steps 1–8 passed (including the public-visibility acknowledgement when the target is public or unknown)' >/dev/null
      flat references/paths/import-notes.md | grep -F 'steps 1–11 passed (including the public-visibility acknowledgement when the target is public or unknown)' >/dev/null
      flat references/paths/import-notes.md | grep -F '| I9 | Visibility ack |' >/dev/null
      flat SKILL.md | grep -F 'public-visibility acknowledgement given when the target is public or of unknown visibility' >/dev/null
      flat SKILL.md | grep -F -e '- `atlas_target_visibility` is `public` or `unknown` for remember / import-notes / compile-push → ask the separate public-visibility acknowledgement' >/dev/null
      rg -n -F -- '- [ ] Target visibility determined from the push remote / hosting service' SKILL.md
      flat references/paths/query.md | grep -F 'no write confirmation and no public-visibility acknowledgement' >/dev/null
