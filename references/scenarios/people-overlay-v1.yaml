id: people-overlay-v1
packages:
  - atlas-people
work_id: 2026-10-09-people-overlay
adversarial: true
# Run every check from the package root (bash scripts/run-scenarios.sh).
# The live overlay smoke needs ATLAS_CLI (an Atlas checkout's
# scripts/atlas.py) and records a deferral when it is unset.
smokes:
  - id: overlay-files-present
    source: atlas-schema-path-3a
    expect: the package ships contributions/atlas-people with SCHEMA.overlay.json, templates/person.md, and a README
    check: |
      test -f contributions/atlas-people/SCHEMA.overlay.json
      test -f contributions/atlas-people/templates/person.md
      test -f contributions/atlas-people/README.md
      python3 -c 'import json; json.load(open("contributions/atlas-people/SCHEMA.overlay.json"))'
      rg -n '^type: person$' contributions/atlas-people/templates/person.md
      rg -n '^person_contract: v1$' contributions/atlas-people/templates/person.md
  - id: overlay-root-keys-contract-only
    source: atlas-schema-root-keys
    expect: overlay root keys are a subset of contribution_id and templates; contribution_id is atlas-people; no claimed folders
    check: |
      python3 - <<'PY'
      import json
      o = json.load(open("contributions/atlas-people/SCHEMA.overlay.json"))
      extra = set(o) - {"contribution_id", "templates"}
      assert not extra, f"extra root keys: {sorted(extra)}"
      assert o["contribution_id"] == "atlas-people", o["contribution_id"]
      assert "claimed_folders" not in o
      PY
  - id: overlay-no-extension-slot
    source: atlas-schema-extension-slot
    expect: the overlay carries no atlas_people extension slot, so older Atlas readers compile SCHEMA 2.0 stores that hold it
    check: |
      python3 -c 'import json; o=json.load(open("contributions/atlas-people/SCHEMA.overlay.json")); assert "atlas_people" not in o, o'
  - id: overlay-no-core-redeclare
    source: atlas-schema-hard-rule-3
    expect: the overlay declares only the new type person, redeclares no core type, and stays within 8 required frontmatter keys
    check: |
      python3 - <<'PY'
      import json
      o = json.load(open("contributions/atlas-people/SCHEMA.overlay.json"))
      types = o["templates"]["by_type"]
      core = {"work", "document", "experience", "decision", "lesson", "recipe",
              "protostar", "gist", "frame", "memory", "schema"}
      assert set(types) == {"person"}, sorted(types)
      assert not set(types) & core
      req = types["person"]["frontmatter"]["required"]
      assert len(req) <= 8, req
      PY
  - id: overlay-live-smoke
    source: atlas-schema-test-both-stores
    expect: with ATLAS_CLI set, the overlay installs, compiles, flags a missing person_id, upgrades by uninstall and install (receipt lists templates/person.md again), and uninstalls (overlay and template gone, person pages kept) on SCHEMA 1.0 and 2.0 stores, and pins the Atlas plain re-install receipt behaviour; otherwise a deferral is recorded
    check: |
      bash scripts/overlay-smoke.sh
  - id: skill-mount-overlay-commands
    source: atlas-schema-path-3a
    expect: SKILL.md documents schema install from contributions/atlas-people, schema uninstall atlas-people, and an upgrade that re-runs the mount as uninstall then install from the new package root (no plain re-install)
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      flat SKILL.md | grep -F 'schema install <pkg-root>/contributions/atlas-people --root <atlas-root>' >/dev/null
      flat SKILL.md | grep -F 'schema uninstall atlas-people --root <atlas-root>' >/dev/null
      flat SKILL.md | grep -F 'apm_modules/sergio-sisternes-epam/atlas-people/' >/dev/null
      flat SKILL.md | grep -F 'apm.lock.yaml' >/dev/null
      flat SKILL.md | grep -F 'Overlay mount / upgrade / remove | **EXTERNAL** (`atlas` path `schema`)' >/dev/null
      for f in SKILL.md README.md contributions/atlas-people/README.md; do
        flat "$f" | grep -F 'schema install <new-pkg-root>/contributions/atlas-people' >/dev/null \
          || flat "$f" | grep -F 'schema install \ <new-pkg-root>/contributions/atlas-people' >/dev/null \
          || { echo "missing upgrade install from new package root: $f"; exit 1; }
        flat "$f" | grep -F 'templates/person.md' >/dev/null || { echo "missing template note: $f"; exit 1; }
      done
      flat SKILL.md | grep -F 'uninstall, then install, then compile' >/dev/null
      flat SKILL.md | grep -F 'neither refreshes that template nor keeps it on the receipt' >/dev/null
      flat SKILL.md | grep -F 'it is an unused template' >/dev/null || flat SKILL.md | grep -F 'It is an unused template' >/dev/null
      flat CHANGELOG.md | grep -F 'then `schema install <new-pkg-root>/contributions/atlas-people`' >/dev/null
      ! flat SKILL.md | grep -F 're-run from the new package root (with `--force`' >/dev/null
      ! flat SKILL.md | grep -F 'add `--force` when the overlay' >/dev/null
  - id: skill-mount-confirmed-target-only
    source: owner-design-target-neutral
    expect: SKILL.md mounts the overlay only on the operator-confirmed target, asks first, and treats a declined mount as advisory
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      flat SKILL.md | grep -F "it never mounts the overlay into any Atlas" >/dev/null
      flat SKILL.md | grep -F 'Mount only on the Atlas the operator confirmed as the target for this run' >/dev/null
      flat SKILL.md | grep -F 'Never mount on an Atlas the operator did not name and confirm' >/dev/null
      flat SKILL.md | grep -F 'This is advisory, never a block' >/dev/null
  - id: skill-mount-skipped-on-dry-run
    source: review-feedback-dry-run-mount
    expect: the overlay mount runs only on a real write run (memory_sync on); query, previews, and dry runs skip it so no schema.d/ or templates/ mutation happens
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      flat SKILL.md | grep -F 'For remember and import-notes with `memory_sync: on` (a real write run), run **2. Mount the Atlas overlay**' >/dev/null
      flat SKILL.md | grep -F '**Skip the mount** for query and for any preview or dry run (`memory_sync: off`): no `schema install`, no compile, no change to `schema.d/` or `templates/`' >/dev/null
      flat SKILL.md | grep -F '**Skip this step** for query and for previews or dry runs (`memory_sync: off`)' >/dev/null
      flat SKILL.md | grep -F '### 2. Mount the Atlas overlay (confirmed target, write runs only)' >/dev/null
      for f in references/paths/remember.md references/paths/import-notes.md; do
        flat "$f" | grep -F 'do not** mount the Atlas overlay (no `schema install`, no change to `schema.d/` or `templates/`)' >/dev/null || { echo "missing dry-run mount skip: $f"; exit 1; }
      done
      flat references/paths/query.md | grep -F 'Do **not** mount the Atlas overlay' >/dev/null
  - id: person-type-and-legacy
    source: owner-design-person-type
    expect: new person pages use type person; v0.1.2 type document pages stay valid and are recognised by person_contract v1
    check: |
      flat() { tr -s '\n ' '  ' < "$1"; }
      flat references/person-page-schema.md | grep -F '**OKF type:** `person`' >/dev/null
      flat references/person-page-schema.md | grep -F 'Identify person pages by `person_contract: v1`' >/dev/null
      flat references/paths/query.md | grep -F 'legacy v0.1.2 `type: document` pages count' >/dev/null
      flat references/paths/remember.md | grep -F 'New pages use `type: person`' >/dev/null
      ! rg -n -e 'do not invent overlay[s]' -e '\*\*no\*\* native `perso[n]` type' references/paths references/person-page-schema.md SKILL.md README.md contributions/
  - id: overlay-mirror-lockstep
    source: review-feedback-apm-duplicate
    expect: the .apm mirror still matches the root SKILL.md after the mount step was added
    check: |
      cmp SKILL.md .apm/skills/atlas-people/SKILL.md
      rg -n -F 'Mount the Atlas overlay' .apm/skills/atlas-people/SKILL.md
